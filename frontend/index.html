<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NFT Marketplace UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>NFT Marketplace (Fractional Royalties)</h1>

    <section class="row">
      <label>FractionalRoyaltyNFT address</label>
      <input id="nftAddress" placeholder="0x..." />

      <label>NFTMarketplace address</label>
      <input id="marketAddress" placeholder="0x..." />

      <button id="connect">Connect Wallet</button>
      <div id="account" class="muted"></div>
    </section>

    <section class="row split">
      <div>
        <h2>Mint NFT</h2>
        <label>To (owner account)</label>
        <input id="mintTo" placeholder="0x... or leave empty for connected" />
        <label>Token URI</label>
        <input id="tokenURI" placeholder="https://..." />
        <label>Royalty receivers (JSON array of [address,share])</label>
        <textarea id="receivers" rows="4">[["0x...",5000],["0x...",5000]]</textarea>
        <button id="mint">Mint</button>
      </div>

      <div>
        <h2>List / Buy</h2>
        <label>Token ID</label>
        <input id="tokenId" placeholder="1" />
        <label>Price (ETH)</label>
        <input id="price" placeholder="0.1" />
        <button id="approve">Approve Marketplace</button>
        <button id="list">List NFT</button>
        <button id="buy">Buy NFT</button>
      </div>
    </section>

    <section class="row">
      <h2>Payouts</h2>
      <button id="balances">Show My Accrued Balance</button>
      <div id="balance" class="muted"></div>
      <button id="withdraw">Withdraw Payments</button>
    </section>

    <section>
      <h2>Logs</h2>
      <pre id="log"></pre>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
